name: openwebui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION}
    container_name: open-webui
    restart: always

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OPENAI_API: false
      ENABLE_OLLAMA_API: true
      OLLAMA_BASE_URL: ${OLLAMA_ADDRESS}
      ENABLE_WEB_SEARCH: true
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: ${SEARXNG_ADDRESS}/search

    volumes:
      - open-webui-data:/app/backend/data
      - ${WEBUI_FILES_PATH}:/app/backend/data/files

    networks:
      - default
      - ai_apps_shared

volumes:
  open-webui-data:

networks:
  default:
    name: openwebui_default

  ai_apps_shared:
    external: true
    name: ai_apps_shared